load_from: null
epochs: 1
batchsize: 2048
val_batchsize: 2048
optimizer: "adamw"
max_learning_rate: 1e-3
min_learning_rate: 1e-5
betas: [0.9, 0.95]
weight_decay: 1e-3
warmup_steps: 2000
gradient_clip_val: 1.0
compile_model: true
compile_mode: "default"
threshold: 0.5

# Loss: plain binary cross entropy or class-balanced focal loss.
loss_type: "bce"  # "bce" or "focal"
focal_loss_alpha: 0.1   # positive-class weight; negative class uses 1-alpha
focal_loss_gamma: 3.0   # focusing strength; used only by focal loss
task_type: "train"
